# Matermonial CI — quality checks and backend tests.
#
# Scope: approved tooling only (CLAUDE.md CC-R08, CC-R11, CC-R58, CC-R60; TR-13 approved).
# - No deployment, no image build, no cloud access, no repository secrets.
# - Supported Python versions: 3.12 and 3.13 (DR-2026-11-17-G3C-2). Both are tested.
# - Dependencies install from the hashed pip-tools lockfiles (D4). The lockfiles are compiled
#   with Python 3.12, the minimum supported version, so the consistency check runs on 3.12.
# - Tests run on PostgreSQL 16 and 18 (TR-13), in throwaway CI service containers. Their
#   credentials are not secrets. The service is published on port 55432, never 5432.
# - Every test runs, in two groups: the PostgreSQL-marked foundation tests, then all other
#   tests. Any failure, error or collection error fails the job. There is no continue-on-error.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install locked dependencies (hash-checked)
        run: pip install -r requirements/local.txt

      - name: Verify dependency consistency
        run: pip check

      - name: Verify the production lockfile installs (hash-checked)
        run: |
          python -m venv /tmp/prod
          /tmp/prod/bin/pip install -r requirements/production.txt
          /tmp/prod/bin/pip check

      - name: Verify lockfiles match their inputs (compiled with Python 3.12)
        if: matrix.python-version == '3.12'
        # Recompile from a copy of each committed lockfile (pip-compile keeps existing pins),
        # so this fails only if a lockfile no longer satisfies its .in file, not on new upstream releases.
        shell: bash
        run: |
          status=0
          for r in base local production; do
            cp "requirements/$r.txt" "/tmp/$r.txt"
            pip-compile --quiet --generate-hashes --allow-unsafe --strip-extras \
              --no-emit-index-url --output-file="/tmp/$r.txt" "requirements/$r.in"
            if ! diff <(grep -v '^#' "requirements/$r.txt") <(grep -v '^#' "/tmp/$r.txt") > /dev/null; then
              echo "requirements/$r.txt is out of date: regenerate it (backend/requirements/README.md)"
              status=1
            fi
          done
          exit $status

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: matermonial_ci
          POSTGRES_PASSWORD: matermonial_ci
          POSTGRES_DB: matermonial_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U matermonial_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://matermonial_ci:matermonial_ci@127.0.0.1:55432/matermonial_ci
      MATERMONIAL_TEST_POSTGRES_URL: postgresql://matermonial_ci:matermonial_ci@127.0.0.1:55432/matermonial_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install locked dependencies (hash-checked)
        run: pip install -r requirements/local.txt

      - name: Require the disposable PostgreSQL test database
        # Without this URL the PostgreSQL foundation tests would skip, and the job could go green.
        shell: bash
        run: |
          if [ -z "${MATERMONIAL_TEST_POSTGRES_URL:-}" ]; then
            echo "::error::MATERMONIAL_TEST_POSTGRES_URL is missing or empty; the PostgreSQL foundation tests cannot run."
            exit 1
          fi
          echo "MATERMONIAL_TEST_POSTGRES_URL is set (value not printed)."

      - name: PostgreSQL foundation tests
        run: pytest -m postgres

      - name: All other tests (application and unit tests)
        run: pytest -m "not postgres"
